# =============================================================================
# Quarkus + Kogito - Configuración
# =============================================================================

# Servidor
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# CORS (permitir acceso desde cualquier origen para pruebas locales)
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Swagger UI - habilitado siempre (incluyendo producción)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi

# Health
quarkus.smallrye-health.ui.always-include=true

# Kogito
kogito.generate.rest=true

# Logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] %s%e%n
